<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Jot</title>
</head>

<body>
  <div id="app" class="jot-app">
    <aside class="jot-sidebar">
      <header class="jot-sidebar-header">
        <h1 class="jot-brand">Jot...</h1>
        <p id="jot-count" class="jot-count">0 Jots</p>
      </header>

      <section class="jot-create">
        <h2 class="jot-create-label">Add a Jot</h2>
        <form id="create-jot-form" class="jot-create-form">
          <fieldset id="jot-color-picker" class="jot-colors" aria-label="Jot color"></fieldset>
          <input
            type="text"
            name="title"
            class="jot-title-input"
            placeholder="Title"
            minlength="3"
            maxlength="15"
            required
            autocomplete="off"
          >
          <p id="create-jot-error" class="jot-form-error" hidden role="alert"></p>
          <button type="submit" class="btn btn-primary btn-create">Create +</button>
        </form>
      </section>

      <div id="jots-list" class="jots-list" role="list" aria-label="Your jots"></div>
    </aside>

    <main id="jot-workspace" class="jot-workspace" aria-live="polite"></main>
  </div>

  <script src="app/App.js" type="module"></script>
</body>

</html>
